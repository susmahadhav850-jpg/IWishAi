
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Profile | IWishAi</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080811;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

.topbar {
  height: 70px;
  padding: 0 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #11111d;
  border-bottom: 1px solid #29243c;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  background: linear-gradient(90deg,#b34cff,#12c9e8);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.back-btn {
  color: white;
  text-decoration: none;
  background: #242236;
  padding: 10px 17px;
  border-radius: 25px;
}

.container {
  max-width: 1000px;
  margin: 45px auto;
  padding: 0 20px;
}

.profile-card {
  background: linear-gradient(145deg,#191727,#11111c);
  border: 1px solid #39304f;
  border-radius: 25px;
  padding: 35px;
  box-shadow: 0 10px 40px #0008;
}

.profile-top {
  display: flex;
  align-items: center;
  gap: 25px;
  flex-wrap: wrap;
}

.avatar {
  width: 125px;
  height: 125px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #a84dff;
  background: #29243c;
}

.profile-info {
  flex: 1;
  min-width: 180px;
}

.display-name {
  font-size: 29px;
  margin-bottom: 8px;
}

.username {
  color: #b58aff;
  font-size: 16px;
  margin-bottom: 15px;
}

.bio {
  color: #c5c2d1;
  line-height: 1.7;
  font-size: 15px;
  overflow-wrap: anywhere;
}

.edit-btn {
  border: none;
  padding: 13px 22px;
  border-radius: 25px;
  color: white;
  font-size: 15px;
  font-weight: bold;
  background: linear-gradient(90deg,#a33cff,#09bde2);
  cursor: pointer;
}

.edit-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.joined {
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid #343044;
  color: #9995aa;
  font-size: 14px;
}

.section-title {
  font-size: 23px;
  margin: 35px 0 20px;
}

.message {
  color: #aaa5b9;
  text-align: center;
  padding: 25px 10px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #000c;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal-box {
  width: 100%;
  max-width: 430px;
  background: #191727;
  border: 1px solid #594477;
  border-radius: 22px;
  padding: 25px;
}

.modal-box h2 {
  margin-bottom: 20px;
}

.modal-box label {
  display: block;
  color: #c8c3d6;
  margin: 14px 0 7px;
  font-size: 14px;
}

.modal-box input,
.modal-box textarea {
  width: 100%;
  background: #0e0d19;
  color: white;
  border: 1px solid #39334c;
  border-radius: 10px;
  padding: 13px;
  font-size: 15px;
  outline: none;
}

.modal-box textarea {
  resize: vertical;
  min-height: 90px;
}

.modal-actions {
  display: flex;
  gap: 12px;
  margin-top: 22px;
}

.modal-actions button {
  flex: 1;
  padding: 13px;
  border-radius: 25px;
  border: none;
  font-size: 15px;
  cursor: pointer;
}

.cancel-btn {
  background: #302c40;
  color: white;
}

.save-btn {
  background: linear-gradient(90deg,#a33cff,#09bde2);
  color: white;
  font-weight: bold;
}

/* ==================================
   CREATOR ARTWORK GALLERY
   ================================== */

.artwork-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.artwork-card {
  position: relative;
  overflow: hidden;
  background: #191727;
  border: 1px solid #39304f;
  border-radius: 17px;
}

/* THREE DOTS POST MENU */

.artwork-menu-wrap {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 5;
}

.artwork-menu-button {
  width: 36px;
  height: 36px;
  border: 1px solid #ffffff30;
  border-radius: 50%;
  background: #090811cc;
  color: white;
  font-size: 23px;
  cursor: pointer;
}

.artwork-menu {
  display: none;
  position: absolute;
  top: 42px;
  right: 0;
  min-width: 145px;
  padding: 7px;
  background: #211d32;
  border: 1px solid #594477;
  border-radius: 12px;
  box-shadow: 0 8px 25px #0009;
}

.artwork-menu.show {
  display: block;
}

.delete-post-option {
  width: 100%;
  padding: 11px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: #ff7777;
  text-align: left;
  cursor: pointer;
  font-size: 14px;
}

.delete-post-option:hover {
  background: #ffffff12;
}

.artwork-image {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
  cursor: pointer;
  background: #242236;
}

.artwork-details {
  padding: 14px;
}

.artwork-title {
  font-size: 15px;
  margin-bottom: 9px;
  overflow-wrap: anywhere;
}

.artwork-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  color: #aaa5b9;
  font-size: 12px;
}

.artwork-like {
  border: none;
  background: transparent;
  color: #ff5b9a;
  font-size: 15px;
  cursor: pointer;
}

.prompt-btn {
  background: #302c40;
  color: white;
  border: 1px solid #514765;
  padding: 8px 12px;
  border-radius: 18px;
  cursor: pointer;
}

.artwork-menu {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 2;
}

.artwork-menu-button {
  width: 36px;
  height: 36px;
  border: 1px solid #ffffff44;
  border-radius: 50%;
  background: #100e1dcc;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

.delete-menu {
  display: none;
  position: absolute;
  top: 42px;
  right: 0;
  min-width: 130px;
  background: #29243c;
  border: 1px solid #594477;
  border-radius: 10px;
  padding: 10px;
}

.delete-menu button {
  width: 100%;
  background: transparent;
  border: none;
  color: #ff7777;
  padding: 8px;
  text-align: left;
  cursor: pointer;
}

@media(max-width:600px) {
  .artwork-grid {
    gap: 12px;
  }

  .artwork-details {
    padding: 10px;
  }
}

@media(max-width:600px) {
  .container {
    margin-top: 25px;
  }

  .profile-card {
    padding: 23px;
  }

  .profile-top {
    flex-direction: column;
    text-align: center;
  }

  .profile-info {
    width: 100%;
  }

  .edit-btn {
    width: 100%;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">IWishAi</div>
  <a href="index.html" class="back-btn">← Explore</a>
</header>

<main class="container">

  <section class="profile-card">

    <div class="profile-top">

      <img
        id="profileAvatar"
        class="avatar"
        src="https://placehold.co/200x200/252238/ffffff?text=Creator"
        alt="Creator avatar"
      >

      <div class="profile-info">
        <h1 class="display-name" id="displayName">
          Loading profile...
        </h1>

        <div class="username" id="username">@loading</div>

        <p class="bio" id="bio">
          Loading creator information...
        </p>
      </div>

      <button
        class="edit-btn"
        id="editButton"
        onclick="openEditProfile()"
        disabled
      >
        ✏️ Edit Profile
      </button>

    </div>

    <div class="joined" id="joinedDate">
      Joined: Loading...
    </div>

  </section>

  <h2 class="section-title">🎨 Creator's Artwork</h2>

  <div class="artwork-grid" id="artworkGrid"></div>

<div class="message" id="artworkMessage">
  Loading creator's artwork... 🎨
</div>

</main>

<!-- EDIT PROFILE POPUP -->

<div class="modal" id="editModal">

  <div class="modal-box">

    <h2>✏️ Edit Profile</h2>

    <label for="editAvatar">Profile Picture URL</label>
    <input id="editAvatar" type="url"
      placeholder="Enter image URL">

    <label for="avatarFile">Or Choose From Device Gallery</label>
    <input
      id="avatarFile"
      type="file"
      accept="image/*"
      style="
      width:100%;
      padding:14px;
      background:#0e0d19;
      color:white;
      border:1px solid #39334c;
      border-radius:10px;
    "
  >
    <label for="editUsername">Username</label>
    <input id="editUsername" type="text"
      maxlength="30" placeholder="Your username">

    <label for="editDisplayName">Display Name</label>
    <input id="editDisplayName" type="text"
      maxlength="50" placeholder="Your display name">

    <label for="editBio">Bio</label>
    <textarea id="editBio" maxlength="300"
      placeholder="Tell everyone about yourself..."></textarea>

    <div class="modal-actions">
      <button class="cancel-btn"
        onclick="closeEditProfile()">Cancel</button>

      <button class="save-btn"
        id="saveButton"
        onclick="saveProfile()">Save</button>
    </div>

  </div>

</div>

<!-- DELETE POST CONFIRMATION POPUP -->

<div class="modal" id="deleteConfirmModal">

  <div class="modal-box">

    <h2>🗑️ Delete Post?</h2>

    <p style="color:#c5c2d1; line-height:1.6;">
      Are you sure you want to delete this post?
      This action cannot be undone.
    </p>

    <div class="modal-actions">

      <button
        class="cancel-btn"
        onclick="cancelPendingDelete()">
        Cancel
      </button>

      <button
        class="save-btn"
        id="confirmDeleteButton"
        onclick="confirmDeleteArtwork()"
        style="background:#e04455;">
        Delete
      </button>

    </div>

  </div>

</div>

<script>
/* ==================================
   SUPABASE CONNECTION
   ================================== */

// Replace these two placeholders with the
// exact URL and publishable key from index.html.

const SUPABASE_URL = "https://imqxdmmkmxpltosghzzc.supabase.co";
const SUPABASE_KEY = "sb_publishable_M7OVWWuO4ksT0pxV2t7v7w_fj4su0RV";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let profileOwnerId = null;
let currentProfile = null;


/* ==================================
   LOAD CREATOR PROFILE
   ================================== */

async function loadProfile() {

  const { data: authData, error: authError } =
    await supabaseClient.auth.getUser();

  if (authError) {
    console.error(authError);
  }

  currentUser = authData?.user || null;

  const params = new URLSearchParams(
    window.location.search
  );

  profileOwnerId = params.get("user") ||
    currentUser?.id;

  if (!profileOwnerId) {
    document.getElementById("displayName").textContent =
      "Profile unavailable";

    document.getElementById("bio").textContent =
      "Please log in to view your profile.";

    document.getElementById("joinedDate").textContent = "";

    return;
  }

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id, username, display_name, avatar_url, bio, created_at")
    .eq("id", profileOwnerId)
    .maybeSingle();

  if (error) {
    console.error("Profile loading error:", error);

    document.getElementById("displayName").textContent =
      "Could not load profile";

    document.getElementById("bio").textContent =
      error.message;

    return;
  }

  if (!data) {
    document.getElementById("displayName").textContent =
      "Creator not found";

    document.getElementById("bio").textContent =
      "This profile may not exist or may not be accessible.";

    return;
  }

  currentProfile = data;

  document.getElementById("profileAvatar").src =
    data.avatar_url ||
    "https://placehold.co/200x200/252238/ffffff?text=Creator";

  document.getElementById("displayName").textContent =
    data.display_name || data.username || "IWishAi Creator";

  document.getElementById("username").textContent =
    "@" + (data.username || "creator");

  document.getElementById("bio").textContent =
    data.bio || "This creator hasn't written a bio yet.";

  const joined = data.created_at
    ? new Date(data.created_at).toLocaleDateString(
        undefined,
        { day: "numeric", month: "long", year: "numeric" }
      )
    : "Date unavailable";

  document.getElementById("joinedDate").textContent =
    "Joined: " + joined;

  // Only the profile owner sees the edit button.
  if (currentUser && currentUser.id === data.id) {
    document.getElementById("editButton").disabled = false;
    document.getElementById("editButton").style.display = "block";
    } else {
    document.getElementById("editButton").style.display = "none";
  }

  // Load this creator's published artwork
  await loadCreatorArtworks();
}


/* ==================================
   EDIT PROFILE
   ================================== */

function openEditProfile() {

  if (!currentUser || currentUser.id !== profileOwnerId) {
    return;
  }

  document.getElementById("editAvatar").value =
    currentProfile.avatar_url || "";

  document.getElementById("editUsername").value =
    currentProfile.username || "";

  document.getElementById("editDisplayName").value =
    currentProfile.display_name || "";

  document.getElementById("editBio").value =
    currentProfile.bio || "";

  document.getElementById("editModal").style.display =
    "flex";
}

function closeEditProfile() {
  document.getElementById("editModal").style.display =
    "none";
}


/* ==================================
   SAVE PROFILE
   ================================== */


async function saveProfile() {

  if (!currentUser || currentUser.id !== profileOwnerId) {
    alert("You cannot edit another creator's profile.");
    return;
  }

  const username = document.getElementById("editUsername").value.trim();
  const displayName = document.getElementById("editDisplayName").value.trim();
  const avatarUrl = document.getElementById("editAvatar").value.trim();
  const bio = document.getElementById("editBio").value.trim();

  const avatarFile = document.getElementById("avatarFile").files[0];

  if (!username) {
    alert("Please enter a username.");
    return;
  }

  let finalAvatarUrl = avatarUrl || null;

  const saveButton = document.getElementById("saveButton");

  saveButton.disabled = true;
  saveButton.textContent = "Saving...";

  try {

    /* =================================
       UPLOAD AVATAR FROM DEVICE
       ================================= */

    if (avatarFile) {

      const allowedTypes = {
        "image/jpeg": "jpg",
        "image/png": "png",
        "image/webp": "webp",
        "image/gif": "gif"
      };

      if (!allowedTypes[avatarFile.type]) {
        throw new Error("Please choose a JPEG, PNG, WebP or GIF image.");
      }

      if (avatarFile.size > 5 * 1024 * 1024) {
        throw new Error("Avatar must be smaller than 5 MB.");
      }

      const extension = allowedTypes[avatarFile.type];

      const filePath =
        currentUser.id + "/avatar-" +
        Date.now() + "." + extension;

      const { error: uploadError } =
        await supabaseClient.storage
          .from("iwishai-avatars")
          .upload(filePath, avatarFile, {
            cacheControl: "3600",
            contentType: avatarFile.type,
            upsert: false
          });

      if (uploadError) {
        throw uploadError;
      }

      const { data: publicData } =
        supabaseClient.storage
          .from("iwishai-avatars")
          .getPublicUrl(filePath);

      finalAvatarUrl = publicData.publicUrl;
    }

    /* =================================
       UPDATE PROFILE DATABASE RECORD
       ================================= */

    const { data, error } = await supabaseClient
      .from("profiles")
      .update({
        username: username,
        display_name: displayName || null,
        avatar_url: finalAvatarUrl,
        bio: bio || null
      })
      .eq("id", currentUser.id)
      .select("id, username, display_name, avatar_url, bio, created_at")
      .maybeSingle();

    if (error) {
      throw error;
    }

    if (!data) {
      throw new Error("Profile was not updated. Check your permissions.");
    }

    currentProfile = data;

    document.getElementById("avatarFile").value = "";

    closeEditProfile();

    await loadProfile();

    alert("Profile updated successfully! 🎉");

  } catch (error) {

    console.error("Profile save error:", error);

    alert("Could not save profile: " + error.message);

  } finally {

    saveButton.disabled = false;
    saveButton.textContent = "Save";

  }
}

/* ==================================
   LOAD CREATOR ARTWORKS
   ================================== */

async function loadCreatorArtworks() {

  const grid = document.getElementById("artworkGrid");
  const message = document.getElementById("artworkMessage");

  grid.innerHTML = "";
  message.textContent = "Loading creator's artwork... 🎨";

  const { data: artworks, error } = await supabaseClient
    .from("artworks")
    .select(`
      id,
      user_id,
      title,
      prompt,
      image_url,
      category,
      visibility,
      status,
      created_at,
      storage_bucket,
      storage_path
    `)
    .eq("user_id", profileOwnerId)
    .eq("visibility", "public")
    .eq("status", "published")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Artwork loading error:", error);
    message.textContent = "Could not load artwork.";
    return;
  }

  if (!artworks || artworks.length === 0) {
    message.textContent = "This creator hasn't published any artwork yet.";
    return;
  }

  const artworkIds = artworks.map(item => item.id);

  const { data: allLikes, error: likesError } =
    await supabaseClient
      .from("likes")
      .select("user_id, artwork_id")
      .in("artwork_id", artworkIds);

  if (likesError) {
    console.error("Likes loading error:", likesError);
  }

  const likes = allLikes || [];

  artworks.forEach(artwork => {

    const likeCount = likes.filter(
      like => like.artwork_id === artwork.id
    ).length;

    const isLiked = currentUser && likes.some(
      like =>
        like.artwork_id === artwork.id &&
        like.user_id === currentUser.id
    );

    const ownerCanDelete =
      currentUser &&
      currentUser.id === artwork.user_id;

    const card = document.createElement("article");
    card.className = "artwork-card";

    const image = document.createElement("img");
    image.className = "artwork-image";
    image.src = artwork.image_url;
    image.alt = artwork.title || "Creator artwork";
    image.loading = "lazy";

    image.addEventListener("click", () => {
      openArtworkPrompt(artwork);
    });

    card.appendChild(image);

    if (ownerCanDelete) {

      const menu = document.createElement("div");
      menu.className = "artwork-menu";

      const menuButton = document.createElement("button");
      menuButton.className = "artwork-menu-button";
      menuButton.type = "button";
      menuButton.textContent = "⋮";
      menuButton.setAttribute("aria-label", "Artwork options");

      const menuContent = document.createElement("div");
      menuContent.className = "delete-menu";

      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.textContent = "Delete post";

      menuButton.addEventListener("click", () => {
        menuContent.style.display =
          menuContent.style.display === "block" ? "none" : "block";
      });

      deleteButton.addEventListener("click", () => {
        menuContent.style.display = "none";
        confirmDeleteArtwork(artwork);
      });

      menuContent.appendChild(deleteButton);
      menu.appendChild(menuButton);
      menu.appendChild(menuContent);
      card.appendChild(menu);
    }

    const details = document.createElement("div");
    details.className = "artwork-details";

    const title = document.createElement("h3");
    title.className = "artwork-title";
    title.textContent = artwork.title || "Untitled Artwork";

    const meta = document.createElement("div");
    meta.className = "artwork-meta";

    const date = document.createElement("span");
    date.textContent = new Date(
      artwork.created_at
    ).toLocaleDateString();

    const likeButton = document.createElement("button");
    likeButton.className = "artwork-like";
    likeButton.type = "button";

    const updateLikeText = () => {
      const count = likes.filter(
        like => like.artwork_id === artwork.id
      ).length;

      const compactCount = count >= 1000000
        ? (count / 1000000).toFixed(count % 1000000 === 0 ? 0 : 1) + "M"
        : count >= 1000
          ? (count / 1000).toFixed(count % 1000 === 0 ? 0 : 1) + "K"
          : String(count);

      const liked = likes.some(
        like =>
          like.artwork_id === artwork.id &&
          currentUser &&
          like.user_id === currentUser.id
      );

      likeButton.textContent =
        (liked ? "♥ " : "♡ ") + compactCount;
    };

    updateLikeText();

    likeButton.addEventListener("click", async () => {

      if (!currentUser) {
        alert("Please log in to like artwork.");
        return;
      }

      likeButton.disabled = true;

      try {

        const existingLike = likes.find(
          like =>
            like.artwork_id === artwork.id &&
            like.user_id === currentUser.id
        );

        if (existingLike) {

          const { error } = await supabaseClient
            .from("likes")
            .delete()
            .eq("user_id", currentUser.id)
            .eq("artwork_id", artwork.id);

          if (error) throw error;

          const index = likes.indexOf(existingLike);
          likes.splice(index, 1);

        } else {

          const { error } = await supabaseClient
            .from("likes")
            .insert({
              user_id: currentUser.id,
              artwork_id: artwork.id
            });

          if (error) throw error;

          likes.push({
            user_id: currentUser.id,
            artwork_id: artwork.id
          });
        }

        updateLikeText();

      } catch (error) {
        console.error("Like error:", error);
        alert("Could not update like: " + error.message);
      } finally {
        likeButton.disabled = false;
      }
    });

    const promptButton = document.createElement("button");
    promptButton.className = "prompt-btn";
    promptButton.type = "button";
    promptButton.textContent = "View Prompt";

    promptButton.addEventListener("click", () => {
      openArtworkPrompt(artwork);
    });

    meta.appendChild(date);
    meta.appendChild(likeButton);

    details.appendChild(title);
    details.appendChild(meta);
    details.appendChild(promptButton);

    card.appendChild(details);
    grid.appendChild(card);
  });

  message.textContent =
    "Showing " + artworks.length + " published artwork(s).";
}

  
/* ==================================
   START
   ================================== */

loadProfile();

</script>

</body>
</html>
